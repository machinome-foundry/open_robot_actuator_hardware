[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-robot-actuator-hardware-simulation"
version = "0.1.0"
description = "A thin machinome simulation layer for the Open Robot Actuator hardware"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.7",
  "molejo>=0.2",
  "machinome>=0.6",
  "machinome-mechanics",
]

[tool.setuptools.packages.find]
include = ["simulation*"]

[tool.machinome]
model = "actuator-module-v1"

[tool.machinome.models]
actuator-module-v1 = "simulation.actuator:ActuatorModuleV1"

[tool.machinome-studio]
profile = "openspec-builder"
