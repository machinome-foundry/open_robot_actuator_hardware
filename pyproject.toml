[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-robot-actuator-hardware-simulation"
version = "0.1.0"
description = "A thin solid-node simulation layer for the Open Robot Actuator hardware"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.7",
  "molejo>=0.2",
  "solid-node>=0.6",
]

[tool.setuptools.packages.find]
include = ["simulation*"]

[tool.solid-node]
model = "actuator-module-v1"

[tool.solid-node.models]
actuator-module-v1 = "simulation.actuator:ActuatorModuleV1"

[tool.libresolid-studio]
profile = "builder"
